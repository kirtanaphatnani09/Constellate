=>`constellate:user:${e.toLowerCase()}`,dm=[{id:"drift",name:"Watch it drift",instruction:"Find something that moves without needing you \u2014 clouds, a ceiling fan, steam off your cup, leaves, rain on a window. Think of the long, still shots of sky and laundry lines in Ozu's films: nothing happens, and that's the point. Just let your eyes rest on it.",why:"Gentle, slow-moving things hold attention without effort \u2014 what researchers call soft fascination. Because they ask so little of you, they leave room for thought to wander and reflect.",source:"Kaplan, Attention Restoration Theory"},{id:"walk",name:"Walk nowhere",instruction:"Walk without a destination, like a fl\xE2neur, or like Virginia Woolf crossing London at dusk on the excuse of buying a pencil. Pick turns by whim. If you're stuck in transit, walk the length of the platform and back.",why:"In a set of Stanford experiments, walking lifted creative idea generation for most people compared to sitting \u2014 indoors or out \u2014 and the boost lingered after they sat back down.",source:"Oppezzo & Schwartz, 2014"},{id:"song",name:"Song rewind",instruction:"Put on a song you loved years ago \u2014 one you haven't played in a long time. Don't do anything else. Let it take you wherever it was when you first heard it: a room, a season, a person.",why:"Familiar music lights up the medial prefrontal cortex, a hub that binds sound, emotion and your own life story \u2014 which is why a song can pull a whole memory back in seconds.",source:"Janata, 2009"},{id:"scent",name:"Follow a scent",instruction:"Find a smell \u2014 coffee, rain on dust, a book's pages, soap, your own sleeve. Breathe it slowly. Like Proust's madeleine dipped in tea, let it unlock whatever it wants to. Don't chase the memory; wait for it.",why:"Smell has an unusually direct line to the brain's memory and emotion regions, which is why scent-triggered memories tend to arrive vivid and whole rather than as facts.",source:"Olfactory\u2013limbic memory research"},{id:"dull",name:"Do the dull thing",instruction:"Wash a few dishes, fold laundry, water plants, sort a drawer, or stand in the queue without your phone. Do it slowly. Don't try to think about anything \u2014 the task is only there to keep your hands busy.",why:"People who did a simple, undemanding task during a break came back more creative than those who rested, worked hard, or took no break. The easy task freed the mind to wander.",source:"Baird et al., 2012"},{id:"window",name:"Window seat",instruction:"If you're on a bus, train or in a car, watch the world scroll past without naming anything. If you're not moving, sit by any window. Let buildings, trees and strangers slide through your view like a film you're not required to follow.",why:"A moving view pairs soft fascination with an undemanding task \u2014 two conditions strongly linked to mind wandering. It's why ideas so often show up on commutes.",source:"Kaplan; Baird et al."},{id:"vast",name:"Feel small",instruction:"Find the biggest thing you can see \u2014 the sky, the horizon, a tall tree, the sea, a night full of stars. Like the opening of Carl Sagan's Pale Blue Dot, zoom out until your day looks tiny inside it. Stay there a while.",why:"Awe \u2014 the feeling of facing something vast \u2014 can quiet the chatter of the self and widen your frame. The research is promising but still debated, so treat this one as an experiment.",source:"Keltner; Piff et al., 2015"},{id:"tomorrow",name:"Invent a tomorrow",instruction:"Take three real pieces of your life \u2014 a place you know, a person, something you want \u2014 and rearrange them into a scene that hasn't happened yet. Where are you? What's the light like? What happens next?",why:"Imagining the future uses the same brain network as remembering. The hippocampus recombines fragments of real memories into new scenes \u2014 imagination is memory, rearranged.",source:"Schacter & Addis, constructive simulation"}],fm=[{id:"birds",name:"Birdsong",instruction:"Stop wherever you are and listen for birds \u2014 a crow on a wire, sparrows in a hedge, a koel before the heat, pigeons on a ledge. Try to count how many different voices there are. Don't name them. Just follow one song until it ends.",why:"In interviews, bird songs and calls were the natural sound people most often linked to recovering from stress and mental fatigue. A later smartphone study of over a thousand people found that everyday moments of seeing or hearing birds were followed by lasting lifts in wellbeing.",source:"Ratcliffe et al., 2013; Hammoud et al., 2022"},{id:"sunrise",name:"First light",instruction:"Be awake for the sunrise, or catch the earliest light you can. Watch the sky change colour before the sun appears. Notice the first sounds of the day switching on \u2014 a door, a bird, a kettle, traffic waking up.",why:"Awe comes from meeting something vast that you can't immediately take in. In an eight-week study, people who took short walks aimed at noticing awe felt more joy, more warmth toward others, and less daily distress than people who walked normally.",source:"Sturm, Keltner et al., 2020"},{id:"sunset",name:"Watch the sunset",instruction:"Find a window, rooftop, platform or road facing west. Stay for the whole thing \u2014 not just the orange, but the blue after. Watch the colours stop being colours. Let the day end without you doing anything about it.",why:"Slow gradients of light hold attention without effort (soft fascination), and a wide sky invites the 'small self' feeling of awe \u2014 a sense of proportion between you and the world that researchers could even see in people's photos over time.",source:"Kaplan; Sturm, Keltner et al., 2020"},{id:"wind",name:"Wind in the leaves",instruction:"Find a tree, a curtain, long grass, a flag, anything the wind moves. Watch how it never repeats. Listen to the hiss of leaves getting louder and softer. Let your breathing fall into whatever rhythm it has.",why:"Leaves rustling is one of the textbook examples of soft fascination \u2014 movement that captures attention gently, without draining it, leaving space for the mind to drift and reflect.",source:"Kaplan, Attention Restoration Theory"},{id:"water",name:"Listen to water",instruction:"Find running water \u2014 a tap, a fountain, rain on a roof, waves, a kettle starting to boil. Close your eyes and follow the sound as if it were music with no beginning and no end.",why:"Flowing water and falling rain are classic sources of soft fascination: they hold attention gently without draining it, giving tired, focused attention a chance to recover and the mind room to roam.",source:"Kaplan, Attention Restoration Theory"},{id:"photos",name:"Old photographs",instruction:"Scroll back years in your photos, or open an old album \u2014 stop on one picture that tugs at you. Who took it? What happened just before? What were you worried about then that doesn't matter now?",why:"Across four experiments, feeling nostalgic made people write more creatively, and the effect ran through a boost in openness to experience \u2014 beyond simply being in a good mood.",source:"van Tilburg, Sedikides & Wildschut, 2015"},{id:"origin",name:"Where did it come from?",instruction:"Pick any object near you \u2014 your shoe, a coin, the tea in your cup, the seat you're on. Follow it backwards: who made it, where its materials grew or were dug up, how many hands it passed through to reach you. Don't look it up. Just wonder.",why:"When curiosity is switched on, the brain's reward circuitry lights up and couples with the hippocampus \u2014 and people remember more, even about unrelated things they encounter in that state.",source:"Gruber, Gelman & Ranganath, 2014"},{id:"routine",name:"Break a routine",instruction:"Do one ordinary thing the wrong way round. Get off a stop early, take the other staircase, eat breakfast for dinner, brush your teeth with the other hand. Notice what feels strange.",why:"Actively experiencing something unexpec       .constellate-root textarea {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }

      .constellate-root.plain {
        background: radial-gradient(ellipse 110% 80% at 50% 38%, #1d3260 0%, #11204a 45%, #0a1430 100%);
      }
      .bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
      .bg-stars { position: absolute; inset: 0; width: 100%; height: 100%; }
      @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }

      .bg-nebula {
        position: absolute; border-radius: 50%;
        opacity: 0.42;
      }
      .bg-nebula-a {
        width: 62vmax; height: 62vmax; top: -18vmax; left: -14vmax;
        background: radial-gradient(circle, #1f3a63 0%, transparent 70%);
        animation: drift-a 46s ease-in-out infinite alternate;
      }
      .bg-nebula-b {
        width: 54vmax; height: 54vmax; bottom: -20vmax; right: -16vmax;
        background: radial-gradient(circle, #16324a 0%, transparent 70%);
        animation: drift-b 58s ease-in-out infinite alternate;
      }
      .bg-nebula-c {
        width: 44vmax; height: 44vmax; top: 32%; left: 58%;
        background: radial-gradient(circle, #24316b 0%, transparent 72%);
        animation: drift-c 52s ease-in-out infinite alternate;
      }
      @keyframes drift-a { from { transform: translate(0,0) scale(1); } to { transform: translate(4vmax,3vmax) scale(1.08); } }
      @keyframes drift-b { from { transform: translate(0,0) scale(1); } to { transform: translate(-3vmax,-4vmax) scale(1.06); } }
      @keyframes drift-c { from { transform: translate(0,0) scale(1); } to { transform: translate(-3vmax,3vmax) scale(0.94); } }
      @media (prefers-reduced-motion: reduce) {
        .bg-nebula, .bg-stars circle { animation: none !important; }
      }
      .constellate-root * { box-sizing: border-box; }
      .constellate-root button, .constellate-root input, .constellate-root textarea {
        font-family: inherit; color: inherit;
      }
      :where(.constellate-root button) {
        text-transform: inherit;
        background: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      .constellate-root button:focus-visible,
      .constellate-root input:focus-visible,
      .constellate-root textarea:focus-visible {
        outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .constellate-root * { animation: none !important; transition: none !important; }
      }

      .screen-scroll {
        overflow-y: auto; overflow-x: hidden;
        -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
        touch-action: pan-y;
      }
      .column {
        max-width: 420px;
        margin: 0 auto;
        flex: 1 0 auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: calc(32px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));
        gap: 24px;
        animation: fade-in .5s ease both;
      }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

      .kicker { font-size: 13px; color: var(--text-muted); letter-spacing: 0.02em; }
      h1.display { font-family: var(--font-display); font-weight: 300; font-size: 34px; line-height: 1.15; margin: 0; color: var(--star); }
      h2.display { font-family: var(--font-display); font-weight: 300; font-size: 24px; line-height: 1.25; margin: 0; color: var(--star); }
      .hero-statement {
        font-family: var(--font-display); font-weight: 300; text-transform: lowercase;
        letter-spacing: 0.03em; line-height: 1.3; color: var(--star-dim); margin: 0;
      }
      .soft-statement { font-family: var(--font-soft); font-weight: 500; color: var(--text); margin: 0; }
      p.body { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0; }
      p.muted { font-size: 14px; line-height: 1.6; color: var(--text-muted); margin: 0; }

      .bracket-btn {
        font-family: var(--font-body); font-size: 15px; font-weight: 500;
        color: var(--star); padding: 13px 22px; border: 1px solid rgba(219,230,245,0.28);
        border-radius: 999px; transition: border-color .2s, background .2s;
        min-height: 46px;
      }
      .bracket-btn:hover { border-color: var(--gold); }
      .bracket-btn.primary { background: var(--gold); border-color: var(--gold); color: #0a1120; font-weight: 600; }
      .bracket-btn.primary:hover { background: #8ad4ff; }
      .bracket-btn.danger { border-color: rgba(201,123,107,0.5); color: var(--danger); }
      .bracket-btn:disabled { opacity: 0.4; cursor: not-allowed; }

      .text-link {
        font-size: 14px; color: var(--text-muted); text-decoration: underline;
        text-underline-offset: 3px; text-decoration-color: rgba(124,141,176,0.4);
        padding: 8px 2px;
      }
      .text-link:hover { color: var(--star); text-decoration-color: var(--gold); }

      input.field, textarea.field {
        width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(219,230,245,0.22);
        padding: 10px 2px; font-size: 17px; color: var(--star); resize: none;
      }
      input.field::placeholder, textarea.field::placeholder { color: var(--text-muted); }
      input.field:focus, textarea.field:focus { border-bottom-color: var(--gold); outline: none; }

      .loading { margin: auto; text-align: center; color: var(--text-muted); }
      .pulse-star { font-size: 28px; color: var(--gold); animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

      .toast {
        position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
        background: var(--panel); border: 1px solid rgba(94,200,255,0.35);
        color: var(--star); font-size: 14px; padding: 11px 20px; border-radius: 999px;
        z-index: 200; animation: fade-in .25s ease both;
      }

      /* ---- login ---- */
      .user-chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
      .user-chip {
        border: 1px solid rgba(219,230,245,0.22); border-radius: 999px; padding: 10px 18px;
        font-size: 14px; color: var(--star-dim);
      }
      .user-chip:hover { border-color: var(--gold); color: var(--star); }

      /* ---- compass ---- */
      .compass-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      .compass-wheel { position: relative; width: min(84vw, 340px); aspect-ratio: 1; margin: 8px 0; }
      .compass-center {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
        color: var(--gold); font-size: 20px; opacity: 0.85;
      }
      .compass-node {
        position: absolute; transform: translate(-50%,-50%);
        width: clamp(60px, 19vw, 88px); height: clamp(60px, 19vw, 88px); border-radius: 50%;
        border: 1px solid rgba(219,230,245,0.22);
        display: flex; align-items: center; justify-content: center; text-align: center;
        font-size: clamp(11px, 3.4vw, 13.5px); color: var(--star-dim); padding: 6px; line-height: 1.15;
        transition: border-color .2s, color .2s, background .2s;
        background: rgba(19,26,46,0.4);
      }
      .compass-four .compass-node {
        width: clamp(96px, 30vw, 124px); height: clamp(96px, 30vw, 124px); padding: 10px;
        transition: opacity .22s ease, transform .22s ease, border-color .2s, color .2s, background .2s;
      }
      .compass-four.dealing .compass-node { opacity: 0; transform: translate(-50%,-50%) scale(0.85); }
      .shuffle-btn {
        font-family: var(--font-soft); font-size: 14px; color: var(--gold);
        border: 1px solid rgba(94,200,255,0.35); border-radius: 999px; padding: 10px 18px; min-height: 42px;
      }
      .shuffle-btn:hover { background: var(--gold-soft); }
      .compass-node:hover, .compass-node:active { border-color: var(--gold); color: var(--star); background: var(--gold-soft); }
      .compass-extra-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 380px; }
      .compass-chip {
        border: 1px solid rgba(219,230,245,0.18); border-radius: 999px; padding: 10px 14px;
        font-size: 13px; color: var(--star-dim); min-height: 40px;
      }
      .compass-chip:hover { border-color: var(--gold); color: var(--star); }
      .compass-links { display: flex; flex-direction: column; align-items: center; gap: 2px; }

      /* ---- wander screen ---- */
      .wander-screen {
        flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 36px; padding: calc(32px + env(safe-area-inset-top)) 32px calc(32px + env(safe-area-inset-bottom)); text-align: center;
      }
      .wander-clock { font-family: var(--font-display); font-size: 42px; color: var(--star-dim); letter-spacing: 0.02em; }
      .wander-word { font-family: var(--font-soft); font-weight: 500; font-size: 26px; color: var(--star); }

      .duration-row { display: flex; flex-wrap: wrap; gap: 10px; }
      .duration-btn {
        border: 1px solid rgba(219,230,245,0.22); border-radius: 999px; padding: 10px 16px; font-size: 14px; color: var(--star-dim);
        min-height: 40px;
      }
      .duration-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }

      /* ---- voice notes & photos ---- */
      .media-editor { display: flex; flex-direction: column; gap: 12px; width: 100%; }
      .media-row { display: flex; flex-wrap: wrap; gap: 10px; }
      .media-control { display: flex; flex-direction: column; gap: 6px; }
      .media-btn {
        font-size: 13.5px; color: var(--star); min-height: 40px; padding: 9px 16px;
        border: 1px solid rgba(219,230,245,0.24); border-radius: 999px;
        display: inline-flex; align-items: center; gap: 8px;
      }
      .media-btn:hover { border-color: var(--gold); }
      .media-btn:disabled { opacity: 0.5; }
      .media-btn.recording { border-color: #e2716a; color: #f3b0ab; }
      .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #e2716a; animation: pulse 1.2s ease-in-out infinite; }
      .media-item { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%; }
      .media-photo { width: 100%; max-height: 240px; object-fit: cover; border-radius: 14px; }
      .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
      .photo-cell { position: relative; aspect-ratio: 1; }
      .photo-thumb { width: 100%; height: 100%; padding: 0; border-radius: 12px; overflow: hidden; display: block; }
      .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .photo-remove {
        position: absolute; top: 5px; right: 5px; width: 26px; height: 26px; border-radius: 50%;
        background: rgba(8,11,22,0.78); color: var(--star); font-size: 16px; line-height: 1;
        display: flex; align-items: center; justify-content: center;
      }
      .photo-lightbox {
        position: fixed; inset: 0; z-index: 300; background: rgba(5,8,15,0.94);
        display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out;
      }
      .photo-lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
      .media-audio { width: 100%; height: 40px; }

      /* ---- why this works ---- */
      .why-box {
        border-left: 2px solid var(--gold); padding: 4px 0 4px 14px;
        display: flex; flex-direction: column; gap: 4px;
      }
      .why-label { font-family: var(--font-soft); font-size: 12px; color: var(--gold); margin: 0; letter-spacing: 0.02em; }
      .why-text { font-size: 14px; line-height: 1.55; color: var(--text); margin: 0; }
      .why-source { font-size: 11.5px; color: var(--text-muted); margin: 0; font-style: italic; }

      /* ---- calendar / wander log ---- */
      .cal-nav { display: flex; align-items: center; justify-content: space-between; width: 100%; }
      .cal-month-label { font-size: 14px; color: var(--star); font-weight: 500; }
      .cal-grid {
        display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%;
      }
      .cal-dow-cell {
        text-align: center; font-size: 11px; color: var(--text-muted); padding-bottom: 4px;
      }
      .cal-cell {
        aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 2px;
        font-size: 13px; color: var(--text-muted); border: 1px solid transparent;
      }
      .cal-cell-empty { visibility: hidden; }
      .cal-cell.has-stars { color: var(--star); background: rgba(94,200,255,0.08); }
      .cal-cell.today { border-color: var(--gold); }
      .cal-cell.selected { background: var(--gold-soft); border-color: var(--gold); }
      .cal-star { font-size: 8px; color: var(--gold); line-height: 1; }
      .cal-star-row-mini { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; max-width: 100%; }
      .cal-star-gold { color: var(--star-connect); }
      .cal-star-gold-text { color: var(--star-connect); }
      .cal-day-panel {
        width: 100%; display: flex; flex-direction: column; gap: 4px;
        border-top: 1px solid rgba(219,230,245,0.1); padding-top: 14px;
      }
      .cal-star-row {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        width: 100%; text-align: left; padding: 10px 4px;
        border-bottom: 1px solid rgba(219,230,245,0.08); font-size: 14px; color: var(--text);
      }
      .cal-star-row:hover { color: var(--gold); }

      /* ---- settings ---- */
      .backup-section {
        border-top: 1px solid rgba(219,230,245,0.1); padding-top: 18px;
        display: flex; flex-direction: column; gap: 10px;
      }
      .backup-row { display: flex; flex-wrap: wrap; gap: 16px; }

      /* ---- sky ---- */
      .full { padding: 0; }
      .sky-screen { position: relative; width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
      .sky-topbar {
        display: flex; flex-direction: column; gap: 8px;
        padding: calc(12px + env(safe-area-inset-top)) 14px 10px; z-index: 20;
        background: linear-gradient(to bottom, rgba(8,11,22,0.94), rgba(8,11,22,0));
        position: absolute; top: 0; left: 0; right: 0;
      }
      .sky-topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
      .sky-modes { display: flex; gap: 3px; background: rgba(19,26,46,0.7); border: 1px solid rgba(219,230,245,0.14); border-radius: 999px; padding: 3px; }
      .sky-mode-btn { font-size: 12px; padding: 9px 10px; border-radius: 999px; color: var(--text-muted); min-height: 38px; }
      .sky-mode-btn.active { background: var(--gold-soft); color: var(--gold); }
      .sky-hint {
        text-align: center; z-index: 15;
        font-size: 12.5px; color: var(--text-muted); pointer-events: none; padding: 0 12px;
      }
      .sky-canvas { flex: 1; touch-action: none; width: 100%; height: 100%; }
      .sky-actions {
        position: absolute; bottom: calc(96px + env(safe-area-inset-bottom)); left: 50%;
        transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 20;
      }
      .wander-cta {
        width: 96px; height: 96px; border-radius: 50%; padding: 0; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background:

      .wander-cta:hover { filter: brightness(1.15); }
      .add-idea-link { font-size: 13px; }
      .moon-anchor {
        position: fixed; transform: translate(-50%, -50%); z-index: 30;
        display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
      }
      .moon-anchor, .moon-anchor .wander-cta { touch-action: none; }
      .moon-anchor .wander-cta { cursor: grab; transition: transform .15s ease, filter .15s; }
      .moon-anchor .wander-cta.dragging { cursor: grabbing; transform: scale(1.06); filter: brightness(1.1); }
      .moon-hint { font-size: 11.5px; color: var(--text-muted); margin: 0; max-width: 200px; }
      .landing-sky-link {
        position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
        bottom: calc(34px + env(safe-area-inset-bottom));
      }
      .sky-zoom {
        position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); right: 16px;
        display: flex; flex-direction: column; gap: 8px; z-index: 20;
      }
      .zoom-btn {
        width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(219,230,245,0.2);
        background: rgba(19,26,46,0.75); color: var(--star-dim); font-size: 18px;
      }
      .sky-empty {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; text-align: center; padding: 32px; pointer-events: none;
      }
      .sky-empty .bracket-btn { pointer-events: all; }
      .constellate-fab {
        position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 25;
      }

      /* ---- modals ---- */
      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(5,8,15,0.72); z-index: 100;
        display: flex; align-items: flex-end; justify-content: center;
        animation: fade-in .2s ease both;
      }
      @media (min-width: 560px) { .modal-backdrop { align-items: center; } }
      .modal-sheet {
