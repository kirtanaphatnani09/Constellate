/* ---- today's four: a fresh, seeded set each day; shuffle deals the next four ---- */
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function seededRandom(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) {
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}
function seededShuffle(list, seedStr) {
  const rand = seededRandom(seedStr);
  const arr = [...list];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
/* Each "deck" is the whole list shuffled; we deal it out four at a time,
   so shuffling never repeats a cue until every cue has been seen once. */
function dealFour(day, count) {
  const perDeck = Math.floor(ALL_ACTIVITIES.length / 4);
  const deckIndex = Math.floor(count / perDeck);
  const hand = count % perDeck;
  const deck = seededShuffle(ALL_ACTIVITIES, `${day}#${deckIndex}`);
  return deck.slice(hand * 4, hand * 4 + 4);
}
/* Kept at module level so the shuffle position survives leaving and returning

/* Merge two data blobs by id, favoring existing records on conflict.
   Used when restoring a backup file so an import can only add — never
   silently delete — what's already in this browser. */
function mergeById(a = [], b = []) {
  const map = new Map(a.map((x) => [x.id, x]));
  for (const item of b) if (item && item.id && !map.has(item.id)) map.set(item.id, item);
  return Array.from(map.values());
}
function mergeData(existing, incoming) {
  return {
    stars: mergeById(existing.stars, incoming.stars),
    connections: mergeById(existing.connections, incoming.connections),
    constellations: mergeById(existing.constellations, incoming.constellations),
    customActivities: mergeById(existing.customActivities, incoming.customActivities),
    moonPos: existing.moonPos || incoming.moonPos,
  };
}

/* Storage: plain browser localStorage. Works on any static host —
   no server or accounts required. Data lives only in this browser. */
async function safeGet(key) {
  try {
    const v = localStorage.getItem(key);
    return v;
  } catch (e) {
    return null;
  }
}
async function safeSet(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (e) {
    return false;
  }
}

const MAX_PHOTOS = 12;
/* Older stars stored a single photoId; newer ones keep a list. */
function starPhotoIds(s) {
  if (!s) return [];
  if (Array.isArray(s.photoIds)) return s.photoIds;
  return s.photoId ? [s.photoId] : [];
}

/* MEDIA-START — voice notes and photos live in IndexedDB, which has far more room than
   localStorage. Each item is a data URL stored under its own id; stars only keep the id. */
function openMediaDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("constellate-media", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("media");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function mediaGet(id) {
  try {
    const db = await openMediaDb();
    return await new Promise((resolve) => {
      const q = db.transaction("media", "readonly").objectStore("media").get(id);
      q.onsuccess = () => resolve(q.result || null);
      q.onerror = () => resolve(null);
    });
  } catch (e) {
    return null;
  }
}
async function mediaSet(id, value) {
  try {
    const db = await openMediaDb();
    return await new Promise((resolve) => {
      const tx = db.transaction("media", "readwrite");
      tx.objectStore("media").put(value, id);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
      tx.onabort = () => resolve(false);
    });
  } catch (e) {
    return false;
  }
}
async function mediaDelete(id) {
  try {
    const db = await openMediaDb();
    await new Promise((resolve) => {
      const tx = db.transaction("media", "readwrite");
      tx.objectStore("media").delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  } catch (e) {}
}

/* Shrinks a photo to at most 1280px on its long side and re-encodes it as JPEG,
   so a phone photo drops from several MB to roughly 100–250 KB. */
function compressImage(file, max = 1280, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("unreadable image")); };
    img.src = url;
  });
}


/* ---------- geometry helpers for constellation boundaries ---------- */
function convexHull(points) {
  if (points.length < 3) return points;
  const pts = [...points].sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop();
  lower.pop();
  return lower.concat(upper);
}
function smoothClosedPath(pts) {
  const n = pts.length;
  if (n < 3) return "";
  let d = `M ${pts[0].x} ${pts[0].y} `;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += `C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y} `;
  }
  return d + "Z";
}
function constellationBoundary(memberPts, padding = 46) {
  if (memberPts.length === 0) return null;
  if (memberPts.length === 1) {
    const p = memberPts[0];
    return { path: null, circle: { cx: p.x, cy: p.y, r: padding }, cx: p.x, cy: p.y };
  }
  if (memberPts.length === 2) {
    const [a, b] = memberPts;
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const pts = [
      { x: a.x + nx * padding, y: a.y + ny * padding },
      { x: b.x + nx * padding, y: b.y + ny * padding },
      { x: b.x - nx * padding, y: b.y - ny * padding },
      { x: a.x - nx * padding, y: a.y - ny * padding },
    ];
    return { path: smoothClosedPath(pts), cx, cy };
  }
  const cx = memberPts.reduce((s, p) => s + p.x, 0) / memberPts.length;
  const cy = memberPts.reduce((s, p) => s + p.y, 0) / memberPts.length;
  const hull = convexHull(memberPts);
  const expanded = hull.map((p) => {
    const dx = p.x - cx, dy = p.y - cy;
    const len = Math.hypot(dx, dy) || 1;
    return { x: p.x + (dx / len) * padding, y: p.y + (dy / len) * padding };
  });
  return { path: smoothClosedPath(expanded), cx, cy };
}

function ConstellateApp() {

      document.head.appendChild(link);
    }
    (async () => {
      const raw = await safeGet(USERS_KEY);
      setUsersList(raw ? JSON.parse(raw) : []);
      setBooting(false);
    })();
  }, []);

  function showToast(msg) {
    setToast(msg);
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(() => setToast(null), 2200);
  }

  async function loginAs(name) {
    name = name.trim();
    if (!name) return;
    let list = usersList;
    if (!list.includes(name)) {
      list = [...list, name];
      setUsersList(list);
      await safeSet(USERS_KEY, JSON.stringify(list));
    }
    const raw = await safeGet(userKey(name));
    setData(raw ? JSON.parse(raw) : emptyData());
    setCurrentUser(name);
    setScreen("landing");
  }

  function logout() {
    setCurrentUser(null);
    setData(emptyData());
    setScreen("login");
    setSkyMode("open");
  }

  const persist = useCallback(
    (next) => {
      setData(next);
      if (currentUser) safeSet(userKey(currentUser), JSON.stringify(next));
    },
    [currentUser]
  );

  // Like persist, but works from the latest state — safe to call after awaiting media writes.
  function persistWith(fn) {
    setData((prev) => {
      const next = fn(prev);
      if (currentUser) safeSet(userKey(currentUser), JSON.stringify(next));
      return next;
    });
  }

  /* ---- backup: export to a downloadable file, import/merge from one ---- */
  async function exportBackup() {
    const media = {};
    for (const s of data.stars) {
      const ids = [s.audioId, ...starPhotoIds(s)].filter(Boolean);
      for (const id of ids) {
        const value = await mediaGet(id);
        if (value) media[id] = value;
      }
    }
    const payload = { app: "constellate", version: 2, user: currentUser, exportedAt: Date.now(), data, media };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const dateStr = new Date().toISOString().slice(0, 10);
    const safeName = currentUser.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "sky";
    const a = document.createElement("a");
    a.href = url;
    a.download = `constellate-${safeName}-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast("Backup downloaded");
  }

  function importBackupFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const parsed = JSON.parse(reader.result);
        const incoming = parsed && parsed.data ? parsed.data : parsed;
        if (!incoming || !Array.isArray(incoming.stars)) throw new Error("bad shape");
        if (parsed.media) {
          for (const [id, value] of Object.entries(parsed.media)) await mediaSet(id, value);
        }
        const before = data.stars.length;
        const merged = mergeData(data, incoming);
        persist(merged);
        const added = merged.stars.length - before;
        showToast(added > 0 ? `Restored ${added} star${added === 1 ? "" : "s"}` : "Backup restored — nothing new to add");
      } catch (e) {
        showToast("That doesn't look like a Constellate backup file");
      }
    };
    reader.readAsText(file);
  }

  /* ---- star / connection / constellation mutations ---- */
  function addStar({ name, content, activityName, extra = {} }) {
    const jitter = () => Math.floor(Math.random() * 360 - 180);
    const fallbackName = content.trim() ? "untitled" : extra.audioId ? "voice note" : extra.photoIds && extra.photoIds.length ? "photos" : "untitled";
    const star = {
      id: uid(),
      name: name.trim() || fallbackName,
      content: content.trim(),
      activity: activityName || "Direct capture",
      date: Date.now(),
      x: jitter(),
      y: jitter(),
      ...extra,
    };
    persistWith((prev) => ({ ...prev, stars: [...prev.stars, star] }));
    return star;
  }

  async function saveStarWithMedia({ name, content, activityName, audio, photos = [] }) {
    const extra = {};
    let failed = false;
    if (audio) {
      const id = uid();
      if (await mediaSet(id, audio)) extra.audioId = id; else failed = true;
    }
    if (photos.length) {
      extra.photoIds = [];
      for (const p of photos) {
        const id = uid();
        if (await mediaSet(id, p.src)) extra.photoIds.push(id); else failed = true;
      }
    }
    addStar({ name, content, activityName, extra });
    showToast(failed ? "star saved — but some of the recording or photos couldn't be stored" : "star saved");
  }

  async function addStarPhotos(starId, srcs) {
    const newIds = [];
    for (const src of srcs) {
      const id = uid();
      if (await mediaSet(id, src)) newIds.push(id);
    }
    if (newIds.length < srcs.length) showToast("some photos couldn't be stored on this device");
    persistWith((prev) => ({
      ...prev,
      stars: prev.stars.map((s) =>
        s.id === starId ? { ...s, photoId: null, photoIds: [...starPhotoIds(s), ...newIds] } : s
      ),
    }));
  }
  async function removeStarPhoto(starId, photoId) {
    await mediaDelete(photoId);
    persistWith((prev) => ({
      ...prev,
      stars: prev.stars.map((s) =>
        s.id === starId ? { ...s, photoId: null, photoIds: starPhotoIds(s).filter((p) => p !== photoId) } : s
      ),
    }));
  }

  async function setStarMedia(starId, kind, value) {
    const key = "audioId";
    const star = data.stars.find((s) => s.id === starId);
    if (!star) return;
    if (star[key]) await mediaDelete(star[key]);
    let newId = null;
    if (value) {
      const id = uid();
      if (await mediaSet(id, value)) newId = id;
      else showToast("that couldn't be stored on this device");
    }
    persistWith((prev) => ({ ...prev, stars: prev.stars.map((s) => (s.id === starId ? { ...s, [key]: newId } : s)) }));
  }
  function updateStar(id, patch) {
    persist({ ...data, stars: data.stars.map((s) => (s.id === id ? { ...s, ...patch } : s)) });
  }
  function deleteStar(id) {
    const doomed = data.stars.find((s) => s.id === id);
    if (doomed) {
      if (doomed.audioId) mediaDelete(doomed.audioId);
      starPhotoIds(doomed).forEach((pid) => mediaDelete(pid));
    }
    persist({
      ...data,
      stars: data.stars.filter((s) => s.id !== id),
      connections: data.connections.filter((c) => c.source !== id && c.target !== id),
      constellations: data.constellations
        .map((c) => ({ ...c, members: c.members.filter((m) => m !== id) }))
        .filter((c) => c.members.length > 0),
    });
  }
  function addConnection(source, target) {
    if (source === target) return;
    const exists = data.connections.some(
      (c) => (c.source === source && c.target === target) || (c.source === target && c.target === source)
    );
    if (exists) return showToast("Already connected");
    persist({ ...data, connections: [...data.connections, { id: uid(), source, target, date: Date.now() }] });
    showToast("Connected");
  }
  function removeConnection(id) {
    persist({ ...data, connections: data.connections.filter((c) => c.id !== id) });
    showToast("Connection removed");
  }
  function createConstellation(name, members) {
    const c = { id: uid(), name: name.trim() || "untitled constellation", members, date: Date.now() };
    persist({ ...data, constellations: [...data.constellations, c] });
    showToast("Constellation created");
  }
  function updateConstellation(id, patch) {
    persist({ ...data, constellations: data.constellations.map((c) => (c.id === id ? { ...c, ...patch } : c)) });
  }
  function deleteConstellation(id) {
    persist({ ...data, constellations: data.constellations.filter((c) => c.id !== id) });
    setOpenConstellationId(null);
  }
  function addCustomActivity(name, instruction) {
    const a = { id: uid(), name: name.trim(), instruction: instruction.trim() || "Let it lead wherever it wants to go." };
    persist({ ...data, customActivities: [...data.customActivities, a] });
    return a;
  }

  /* ---- wander flow ---- */
  function beginActivity(activity) {
    setSelectedActivity(activity);
    setSelectedDuration(null);
    setScreen("activity");
  }
  function surpriseMe() {
    const pool = [...ALL_ACTIVITIES, DO_NOTHING, ...data.customActivities];
    const pick = pool[Math.floor(Math.random() * pool.length)];
    beginActivity(pick);
  }
  function startWander() {
    setSessionSeconds(selectedDuration);
    setScreen("wander");
  }
  function endWander() {
    setScreen("return");
  }

  useEffect(() => {
    if (screen !== "wander" || sessionSeconds === null) return;
    if (sessionSeconds <= 0) {
      setScreen("return");
      return;
    }
    const t = setTimeout(() => setSessionSeconds((s) => s - 1), 1000);
    return () => clearTimeout(t);
  }, [screen, sessionSeconds]);

  /* ---------------------------- render ---------------------------- */
  if (booting) {
    return (
      <Shell>
        <Style />
        <div className="loading">
          <div className="pulse-star">✦</div>
          <p>Finding your sky…</p>
        </div>
      </Shell>
    );
  }

  return (
    <Shell full={screen === "sky"}>
      <Style />
      {toast && <div className="toast">{toast}</div>}

      {screen === "login" && <LoginScreen usersList={usersList} onLogin={loginAs} />}

      {screen === "landing" && currentUser && (
        <LandingScreen
          onWander={() => {
            setHubOrigin("landing");
            setScreen("compass");
          }}
          onAddIdea={() => {
            setHubOrigin("landing");
            setSelectedActivity(null);
            setScreen("createStar");
          }}
          onSky={() => setScreen("sky")}
        />
      )}

      {screen === "home" && currentUser && (
        <SettingsScreen
          user={currentUser}
          starCount={data.stars.length}
          onBackToSky={() => setScreen("sky")}
          onLogout={logout}
          onExport={exportBackup}
          onImport={importBackupFile}
        />
      )}

      {screen === "compass" && (
        <CompassScreen
          customActivities={data.customActivities}
          onPick={beginActivity}
          onSurprise={surpriseMe}
          onHome={() => setScreen(hubOrigin)}
          onAddActivity={() => setShowAddActivity(true)}
        />
      )}

      {screen === "activity" && selectedActivity && (
        <ActivityScreen
          activity={selectedActivity}
          selectedDuration={selectedDuration}
          onSelectDuration={setSelectedDuration}
          onBegin={startWander}
          onBack={() => setScreen("compass")}
        />
      )}

      {screen === "wander" && selectedActivity && (
        <WanderScreen
          activity={selectedActivity}
          seconds={sessionSeconds}
          hasTimer={selectedDuration !== null}
          onDone={endWander}
        />
      )}

      {screen === "return" && (
        <ReturnScreen
          onMakeStar={() => setScreen("createStar")}
          onNothing={() => {
            showToast("That's alright. Wander again anytime.");
            setScreen(hubOrigin);
          }}
        />
      )}

      {screen === "createStar" && (
        <CreateStarScreen
          activityName={selectedActivity ? selectedActivity.name : null}
          onCancel={() => setScreen(selectedActivity ? "return" : hubOrigin)}
          onSave={async ({ name, content, audio, photos }) => {
            await saveStarWithMedia({
              name, content, audio, photos,
              activityName: selectedActivity ? selectedActivity.name : "Direct capture",
            });
            setSelectedActivity(null);
            setScreen("sky");
          }}
        />
      )}

      {screen === "sky" && currentUser && (
        <SkyScreen
          data={data}
          mode={skyMode}
          setMode={(m) => {
            setSkyMode(m);
            setLinkFirst(null);
            setGroupSelection([]);
          }}
          linkFirst={linkFirst}
          setLinkFirst={setLinkFirst}
          groupSelection={groupSelection}
          setGroupSelection={setGroupSelection}
          onOpenStar={setOpenStarId}
          onOpenConstellation={setOpenConstellationId}
          onMoveStar={(id, x, y) => updateStar(id, { x, y })}
          onLink={addConnection}
          onRemoveConnection={removeConnection}
          onSettings={() => setScreen("home")}
          onWander={() => {
            setHubOrigin("sky");
            setScreen("compass");
          }}
          onAddIdea={() => {
            setHubOrigin("sky");
            setSelectedActivity(null);
            setScreen("createStar");
          }}
          onConstellate={() => setShowConstellateModal(true)}
          onCalendar={() => setScreen("calendar")}
          moonPos={data.moonPos}
          onMoveMoon={(pos) => persist({ ...data, moonPos: pos })}
        />
      )}

      {screen === "calendar" && (
        <CalendarScreen
          stars={data.stars}
          connections={data.connections}
          constellations={data.constellations}
          onBack={() => setScreen("sky")}
          onOpenStar={setOpenStarId}
          onOpenConstellation={setOpenConstellationId}
        />
      )}

      {openStarId && (
        <StarModal
          star={data.stars.find((s) => s.id === openStarId)}
          onClose={() => setOpenStarId(null)}
          onRename={(name) => updateStar(openStarId, { name })}
          onEdit={(content) => updateStar(openStarId, { content })}
          onSetMedia={(kind, value) => setStarMedia(openStarId, kind, value)}
          onAddPhotos={(srcs) => addStarPhotos(openStarId, srcs)}
          onRemovePhoto={(pid) => removeStarPhoto(openStarId, pid)}
          onDelete={() => {
            deleteStar(openStarId);
            setOpenStarId(null);
            showToast("Star removed from your sky");
          }}
          onLinkFromHere={() => {
            setSkyMode("link");
            setLinkFirst(openStarId);
            setOpenStarId(null);
          }}
        />
      )}

      {openConstellationId && (
        <ConstellationModal
          constellation={data.constellations.find((c) => c.id === openConstellationId)}
          stars={data.stars}
          onClose={() => setOpenConstellationId(null)}
          onRename={(name) => updateConstellation(openConstellationId, { name })}
          onRemoveStar={(starId) => {
            const c = data.constellations.find((c) => c.id === openConstellationId);
            const members = c.members.filter((m) => m !== starId);
            if (members.length === 0) deleteConstellation(openConstellationId);
            else updateConstellation(openConstellationId, { members });
          }}
          onOpenStar={(id) => {
            setOpenConstellationId(null);
            setOpenStarId(id);
          }}
          onDelete={() => deleteConstellation(openConstellationId)}
        />
      )}

      {showAddActivity && (
        <AddActivityModal
          onClose={() => setShowAddActivity(false)}
          onAdd={(name, instruction) => {
            const a = addCustomActivity(name, instruction);
            setShowAddActivity(false);
            beginActivity(a);
          }}
        />
      )}

      {showConstellateModal && (
        <NamePromptModal
          title="What do these make you think of together?"
          placeholder="Name this constellation"
          confirmLabel="Constellate"
          onClose={() => setShowConstellateModal(false)}
          onConfirm={(name) => {
            createConstellation(name, groupSelection);
            setGroupSelection([]);
            setShowConstellateModal(false);
            setSkyMode("open");
          }}
        />
      )}
    </Shell>
  );
}

/* ============================== Shell / Style ============================== */

function Shell({ children, full, plain }) {
  return (
    <div className={`constellate-root${full ? " full" : ""}${plain ? " plain" : ""}`}>
      {!plain && <BackgroundSky />}
      <div style={{ position: "relative", zIndex: 1, display: "flex", flexDirection: "column", flex: 1, minHeight: 0, width: "100%" }}>
        {children}
      </div>
    </div>
  );
}

function BackgroundSky() {
  const stars = React.useMemo(
    () =>
      Array.from({ length: 60 }).map(() => ({
        x: Math.random() * 100,
        y: Math.random() * 100,
        r: Math.random() * 1.3 + 0.35,
        delay: Math.random() * 8,
        dur: 3.5 + Math.random() * 5,
        op: 0.18 + Math.random() * 0.42,
      })),
    []
  );
  return (
    <div className="bg-layer" aria-hidden="true">
      <div className="bg-nebula bg-nebula-a" />
      <div className="bg-nebula bg-nebula-b" />
      <div className="bg-nebula bg-nebula-c" />
      <svg className="bg-stars" preserveAspectRatio="none">
        {stars.map((s, i) => (
          <circle
            key={i}
            cx={`${s.x}%`}
            cy={`${s.y}%`}
            r={s.r}
            fill="#dbe6f5"
            style={{
              opacity: s.op,
              animation: `twinkle ${s.dur}s ease-in-out ${s.delay}s infinite`,
            }}
          />
        ))}
      </svg>
    </div>
  );
}

        display: inline-flex; align-items: center; gap: 8px;
      }
      .media-btn:hover { border-color: var(--gold); }
      .media-btn:disabled { opacity: 0.5; }
      .media-btn.recording { border-color: #e2716a; color: #f3b0ab; }
      .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #e2716a; animation: pulse 1.2s ease-in-out infinite; }
      .media-item { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%; }
      .media-photo { width: 100%; max-height: 240px; object-fit: cover; border-radius: 14px; }
      .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
      .photo-cell { position: relative; aspect-ratio: 1; }
      .photo-thumb { width: 100%; height: 100%; padding: 0; border-radius: 12px; overflow: hidden; display: block; }
      .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .photo-remove {
        position: absolute; top: 5px; right: 5px; width: 26px; height: 26px; border-radius: 50%;
        background: rgba(8,11,22,0.78); color: var(--star); font-size: 16px; line-height: 1;
        display: flex; align-items: center; justify-content: center;
      }
      .photo-lightbox {
        position: fixed; inset: 0; z-index: 300; background: rgba(5,8,15,0.94);
        display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out;
      }
      .photo-lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
      .media-audio { width: 100%; height: 40px; }

      /* ---- why this works ---- */
      .why-box {
        border-left: 2px solid var(--gold); padding: 4px 0 4px 14px;
        display: flex; flex-direction: column; gap: 4px;
      }
      .why-label { font-family: var(--font-soft); font-size: 12px; color: var(--gold); margin: 0; letter-spacing: 0.02em; }
      .why-text { font-size: 14px; line-height: 1.55; color: var(--text); margin: 0; }
      .why-source { font-size: 11.5px; color: var(--text-muted); margin: 0; font-style: italic; }

      /* ---- calendar / wander log ---- */
      .cal-nav { display: flex; align-items: center; justify-content: space-between; width: 100%; }
      .cal-month-label { font-size: 14px; color: var(--star); font-weight: 500; }
      .cal-grid {
        display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%;
      }
      .cal-dow-cell {
        text-align: center; font-size: 11px; color: var(--text-muted); padding-bottom: 4px;
      }
      .cal-cell {
        aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 2px;
        font-size: 13px; color: var(--text-muted); border: 1px solid transparent;
      }
      .cal-cell-empty { visibility: hidden; }
      .cal-cell.has-stars { color: var(--star); background: rgba(94,200,255,0.08); }
      .cal-cell.today { border-color: var(--gold); }
      .cal-cell.selected { background: var(--gold-soft); border-color: var(--gold); }
      .cal-star { font-size: 8px; color: var(--gold); line-height: 1; }
      .cal-star-row-mini { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; max-width: 100%; }
      .cal-star-gold { color: var(--star-connect); }
      .cal-star-gold-text { color: var(--star-connect); }
      .cal-day-panel {
        width: 100%; display: flex; flex-direction: column; gap: 4px;
        border-top: 1px solid rgba(219,230,245,0.1); padding-top: 14px;
      }
      .cal-star-row {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        width: 100%; text-align: left; padding: 10px 4px;
        border-bottom: 1px solid rgba(219,230,245,0.08); font-size: 14px; color: var(--text);
      }
      .cal-star-row:hover { color: var(--gold); }

      /* ---- settings ---- */
      .backup-section {
        border-top: 1px solid rgba(219,230,245,0.1); padding-top: 18px;
        display: flex; flex-direction: column; gap: 10px;
      }
      .backup-row { display: flex; flex-wrap: wrap; gap: 16px; }

      /* ---- sky ---- */
      .full { padding: 0; }
      .sky-screen { position: relative; width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
      .sky-topbar {
        display: flex; flex-direction: column; gap: 8px;
        padding: calc(12px + env(safe-area-inset-top)) 14px 10px; z-index: 20;
        background: linear-gradient(to bottom, rgba(8,11,22,0.94), rgba(8,11,22,0));
        position: absolute; top: 0; left: 0; right: 0;
      }
      .sky-topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
      .sky-modes { display: flex; gap: 3px; background: rgba(19,26,46,0.7); border: 1px solid rgba(219,230,245,0.14); border-radius: 999px; padding: 3px; }
      .sky-mode-btn { font-size: 12px; padding: 9px 10px; border-radius: 999px; color: var(--text-muted); min-height: 38px; }
      .sky-mode-btn.active { background: var(--gold-soft); color: var(--gold); }
      .sky-hint {
        text-align: center; z-index: 15;
        font-size: 12.5px; color: var(--text-muted); pointer-events: none; padding: 0 12px;
      }
      .sky-canvas { flex: 1; touch-action: none; width: 100%; height: 100%; }
      .sky-actions {
        position: absolute; bottom: calc(96px + env(safe-area-inset-bottom)); left: 50%;
        transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 20;
      }

/* ============================== Screens ============================== */

function LoginScreen({ usersList, onLogin }) {
  const [name, setName] = useState("");
  return (
    <div className="column">
      <div className="kicker">Constellate</div>
      <h1 className="hero-statement" style={{ fontSize: 28 }}>Wander freely. Connect unexpectedly.</h1>
      <p className="soft-statement" style={{ fontSize: 21 }}>Give your mind somewhere to go.</p>
      <p className="body">A quiet space for thoughts that usually disappear. Enter a name to open your sky, or start a new one.</p>

      {usersList.length > 0 && (
        <div className="user-chip-row">
          {usersList.map((u) => (
            <button key={u} className="user-chip user-text" onClick={() => onLogin(u)}>
              {u}
            </button>
          ))}
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <input
          className="field"
          placeholder="Your name"
          value={name}
          autoCapitalize="words"
          autoCorrect="off"
          spellCheck={false}
          enterKeyHint="done"
          onChange={(e) => setName(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && onLogin(name)}
        />
        <button className="bracket-btn primary" style={{ alignSelf: "flex-start" }} onClick={() => onLogin(name)} disabled={!name.trim()}>
          [ Enter ]
        </button>
        <p className="muted">Your sky is saved in this browser only — it won't follow you to another device.</p>
      </div>
    </div>
  );
}

/* The moon can be dragged anywhere; a short tap still opens wander.
   Position is stored as fractions of the screen so it adapts to any device. */
function MoonAnchor({ pos, defaultPos, onMove, onWander, onAddIdea, showHint }) {
  const [livePos, setLivePos] = useState(null);
  const drag = useRef(null);
  const lastPos = useRef(null);
  const suppressClick = useRef(false);
  const moonRef = useRef(null);
  const p = livePos || pos || defaultPos;

  // Mobile browsers (iOS Safari especially) can hijack a drag as a scroll and cancel it.
  // A native, non-passive touchmove listener lets us block that while the moon is held.
  useEffect(() => {
    const el = moonRef.current;
    if (!el) return;
    const block = (ev) => { if (drag.current) ev.preventDefault(); };
    el.addEventListener("touchmove", block, { passive: false });
    return () => el.removeEventListener("touchmove", block);
  }, []);

  function finishDrag() {
    const d = drag.current;
    drag.current = null;
    if (d && d.moved && lastPos.current) {
      suppressClick.current = true;
      onMove(lastPos.current);
    }
    lastPos.current = null;
    setLivePos(null);
  }

  function clampPos(clientX, clientY) {
    const w = window.innerWidth, h = window.innerHeight;
    const x = clamp(clientX, 60, w - 60) / w;
    const y = clamp(clientY, 110, h - 100) / h;
    return { x, y };
  }
  function onPointerDown(e) {
    drag.current = { id: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onPointerMove(e) {
    const d = drag.current;
    if (!d || d.id !== e.pointerId) return;
    if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 8) return;
    d.moved = true;
    const next = clampPos(e.clientX, e.clientY);
    lastPos.current = next;
    setLivePos(next);
  }
  function onPointerUp(e) {
    const d = drag.current;
    if (!d || d.id !== e.pointerId) return;
    if (d.moved) lastPos.current = clampPos(e.clientX, e.clientY);
    finishDrag();
  }
  return (
    <div className="moon-anchor" style={{ left: `${p.x * 100}%`, top: `${p.y * 100}%` }}>
      <button
        ref={moonRef}
        className={`wander-cta${livePos ? " dragging" : ""}`}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={finishDrag}
        onClick={() => {
          if (suppressClick.current) { suppressClick.current = false; return; }
          onWander();
        }}
      >
        wander
      </button>
      <button className="text-link add-idea-link" onClick={onAddIdea}>or add an idea</button>
      {showHint && <p className="moon-hint">hold and drag the moon to place it anywhere</p>}
    </div>
  );
}

function LandingScreen({ onWander, onAddIdea, onSky }) {
  return (
    <div className="column" style={{ alignItems: "center", textAlign: "center" }}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
        <button className="wander-cta" onClick={onWander}>wander</button>
        <button className="text-link add-idea-link" onClick={onAddIdea}>or add an idea</button>
        <button className="text-link" style={{ marginTop: 6 }} onClick={onSky}>sky</button>
      </div>
    </div>
  );
}

function SettingsScreen({ user, starCount, onBackToSky, onLogout, onExport, onImport }) {
  const fileInputRef = useRef(null);
  return (
    <div className="column" style={{ justifyContent: "flex-start" }}>
      <button className="text-link" style={{ alignSelf: "flex-start" }} onClick={onBackToSky}>← Sky</button>
      <div className="kicker">Signed in as</div>
      <h1 className="display">{user}</h1>
      <p className="muted">
        {starCount > 0
          ? `Your sky holds ${starCount} star${starCount === 1 ? "" : "s"}.`
          : "Your sky is still empty."}
      </p>

      <div className="backup-section" style={{ borderTop: "none", paddingTop: 4 }}>
        <p className="muted">
          Your sky lives in this browser only. Download a backup, then restore it on another device to bring
          your stars with you — that's also how you keep two devices in sync, and how you get your sky back if
          this browser ever forgets it.
        </p>
        <div className="backup-row">
          <button className="text-link" onClick={onExport}>⬇ Download backup</button>
          <button className="text-link" onClick={() => fileInputRef.current && fileInputRef.current.click()}>
            ⬆ Restore from backup
          </button>
        </div>
        <input
          ref={fileInputRef}
          type="file"
          accept="application/json"
          style={{ display: "none" }}
          onChange={(e) => {
            const file = e.target.files && e.target.files[0];
            onImport(file);
            e.target.value = "";
          }}
        />
      </div>

      <button className="text-link" style={{ alignSelf: "flex-start", marginTop: "auto" }} onClick={onLogout}>
        Not {user}? Switch profile
      </button>
    </div>
  );
}

function CompassScreen({ customActivities, onPick, onSurprise, onHome, onAddActivity }) {
  const day = todayKey();
  if (shuffleState.day !== day) shuffleState = { day, count: 0 };
  const [count, setCount] = useState(shuffleState.count);
  const [dealing, setDealing] = useState(false);
  const activities = dealFour(day, count);
  const n = activities.length;

  function shuffle() {
    setDealing(true);
    setTimeout(() => {
      const next = count + 1;
      shuffleState = { day, count: next };
      setCount(next);
      setDealing(false);
    }, 220);
  }

  return (
    <div className="column">
      <button className="text-link" style={{ alignSelf: "flex-start" }} onClick={onHome}>← Back</button>
      <div className="kicker" style={{ textAlign: "center" }}>{count === 0 ? "today's four" : "four more"}</div>
      <h2 className="display" style={{ textAlign: "center" }}>Where do you want to wander?</h2>
      <p className="muted" style={{ textAlign: "center" }}>Good for a commute, a queue, a waiting room — any pocket of time that's yours.</p>
      <div className="compass-wrap">
        <div className={`compass-wheel compass-four${dealing ? " dealing" : ""}`}>
          <div className="compass-center">✦</div>
          {activities.map((a, i) => {
            const angle = (-90 + (360 / n) * i) * (Math.PI / 180);
            const r = 34;
            const left = 50 + r * Math.cos(angle);
            const top = 50 + r * Math.sin(angle);
            const fontSize = a.name.length > 15 ? "clamp(11px, 3.1vw, 13px)" : "clamp(12.5px, 3.6vw, 15px)";
            return (
              <button
                key={a.id}
                className="compass-node"
                style={{ left: `${left}%`, top: `${top}%`, fontSize }}
                onClick={() => onPick(a)}
              >
                {a.name}
              </button>
            );
          })}
        </div>

        <button className="shuffle-btn" onClick={shuffle}>↻ shuffle for four new ways</button>

        <div className="compass-links">
          <button className="text-link" onClick={() => onPick(DO_NOTHING)}>Do nothing</button>
          <button className="text-link" onClick={onSurprise}>✨ Surprise me</button>
          <button className="text-link" onClick={onAddActivity}>+ Add your own</button>
        </div>

        {customActivities.length > 0 && (
          <div className="compass-extra-row">
            {customActivities.map((a) => (
              <button key={a.id} className="compass-chip user-text" onClick={() => onPick(a)}>
                {a.name}
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

const MAX_RECORDING_SECONDS = 120;

function VoiceRecorder({ onRecorded }) {
  const [recording, setRecording] = useState(false);
  const [secs, setSecs] = useState(0);
  const [error, setError] = useState("");
  const [hitLimit, setHitLimit] = useState(false);
  const recRef = useRef(null);
  const mounted = useRef(true);

  useEffect(() => {
    mounted.current = true;
    return () => {
      mounted.current = false;
      const r = recRef.current;
      if (r && r.mr.state === "recording") r.mr.stop();
      if (r) r.stream.getTracks().forEach((t) => t.stop());
    };
  }, []);

  useEffect(() => {
    if (!recording) return;
    const t = setInterval(() => setSecs((s) => s + 1), 1000);
    return () => clearInterval(t);
  }, [recording]);

  useEffect(() => {
    if (recording && secs >= MAX_RECORDING_SECONDS) { setHitLimit(true); stop(); }
  }, [secs, recording]);

  async function start() {
    setError("");
    setHitLimit(false);
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      setError("voice notes aren't supported in this browser.");
      return;
    }
    let stream;
    try {
      // Ask for the phone's built-in voice clean-up: echo cancellation, background-noise
      // suppression and automatic level, recorded in mono at full speech sample rate.
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1,
          sampleRate: 48000,
        },
      });
    } catch (e) {
      setError("couldn't open the microphone — check this site's microphone permission.");
      return;
    }
    const type = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"].find(
      (t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)
    );
    // Opus (Chrome, Firefox, Android) is very clear at 64 kbps; AAC in mp4 (iPhone Safari)
    // needs more to sound as good. Roughly 0.5–0.75 MB per minute.
    const bitrate = type && type.includes("mp4") ? 96000 : 64000;
    let mr;
    try {
      mr = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: bitrate } : { audioBitsPerSecond: bitrate });
    } catch (e) {
      mr = new MediaRecorder(stream);
    }
    const chunks = [];
    mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      recRef.current = null;
      const blob = new Blob(chunks, { type: mr.mimeType || type || "audio/webm" });
      const reader = new FileReader();
      reader.onload = () => { if (mounted.current) onRecorded(reader.result); };
      reader.readAsDataURL(blob);
      if (mounted.current) setRecording(false);
    };
    recRef.current = { mr, stream };
    mr.start();
    setSecs(0);
    setRecording(true);
  }

  function stop() {
    const r = recRef.current;
    if (r && r.mr.state === "recording") r.mr.stop();
  }

  return (
    <div className="media-control">
      {recording ? (
        <button className="media-btn recording" onClick={stop}>
          <span className="rec-dot" /> {fmtClock(secs)} / {fmtClock(MAX_RECORDING_SECONDS)} · tap to stop
        </button>
      ) : (
        <button className="media-btn" onClick={start}>record a voice note</button>
      )}
      <p className="modal-meta">{hitLimit ? "stopped at 2 minutes — voice notes can be up to 2 minutes long." : "voice notes can be up to 2 minutes long."}</p>
      {error && <p className="modal-meta">{error}</p>}
    </div>
  );
}

function PhotoPicker({ onPicked, remaining }) {
  const inputRef = useRef(null);
  const [progress, setProgress] = useState(null); // null | { done, total }
  const [error, setError] = useState("");
  return (
    <div className="media-control">
      <button className="media-btn" disabled={!!progress} onClick={() => inputRef.current && inputRef.current.click()}>
        {progress ? `preparing ${progress.done + 1} of ${progress.total}…` : "add photos"}
      </button>
      <input
        ref={inputRef}
        type="file"
        accept="image/*"
        multiple
        style={{ display: "none" }}
        onChange={async (e) => {
          const all = Array.from(e.target.files || []);
          e.target.value = "";
          if (!all.length) return;
          const files = all.slice(0, remaining);
          setError(all.length > remaining ? `only ${remaining} more photo${remaining === 1 ? "" : "s"} fit on this star.` : "");
          const out = [];
          for (let i = 0; i < files.length; i++) {
            setProgress({ done: i, total: files.length });
            try { out.push(await compressImage(files[i])); } catch (err) { setError("one of those images couldn't be read."); }
          }
          setProgress(null);
          if (out.length) onPicked(out);
        }}
      />
      {error && <p className="modal-meta">{error}</p>}
    </div>
  );
}

/* ============================== Sky ============================== */

function SkyScreen({
  data, mode, setMode, linkFirst, setLinkFirst, groupSelection, setGroupSelection,
  onOpenStar, onOpenConstellation, onMoveStar, onLink, onRemoveConnection,
  onSettings, onWander, onAddIdea, onConstellate, onCalendar, moonPos, onMoveMoon,
}) {
  const svgRef = useRef(null);
  const [view, setView] = useState({ scale: 1, tx: 0, ty: 0 });
  const pointers = useRef(new Map());
  const dragState = useRef(null);
  const starDrag = useRef(null);

  useEffect(() => {
    const el = svgRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    setView((v) => ({ ...v, tx: rect.width / 2, ty: rect.height / 2 }));
  }, []);

  function toVirtual(clientX, clientY) {
    const rect = svgRef.current.getBoundingClientRect();
    return { x: (clientX - rect.left - view.tx) / view.scale, y: (clientY - rect.top - view.ty) / view.scale };
  }

  function bgPointerDown(e) {
    pointers.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.current.size === 1) {
      dragState.current = { type: "pan", startX: e.clientX, startY: e.clientY, startTx: view.tx, startTy: view.ty };
    } else if (pointers.current.size === 2) {
      const pts = Array.from(pointers.current.values());
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      dragState.current = { type: "pinch", startDist: dist, startScale: view.scale };
    }
  }
  function bgPointerMove(e) {
    if (starDrag.current && starDrag.current.pointerId === e.pointerId) {
      const v = toVirtual(e.clientX, e.clientY);
      onMoveStar(starDrag.current.id, v.x, v.y);
      return;
    }
    if (!pointers.current.has(e.pointerId)) return;
    pointers.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (dragState.current?.type === "pan" && pointers.current.size === 1) {
      const dx = e.clientX - dragState.current.startX;
      const dy = e.clientY - dragState.current.startY;
      setView((v) => ({ ...v, tx: dragState.current.startTx + dx, ty: dragState.current.startTy + dy }));
    } else if (dragState.current?.type === "pinch" && pointers.current.size === 2) {
      const pts = Array.from(pointers.current.values());
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const scale = clamp(dragState.current.startScale * (dist / dragState.current.startDist), 0.3, 3);
      setView((v) => ({ ...v, scale }));
    }
  }
  function bgPointerUp(e) {
    if (starDrag.current && starDrag.current.pointerId === e.pointerId) {
      starDrag.current = null;
      return;
    }
    pointers.current.delete(e.pointerId);
    if (pointers.current.size === 0) dragState.current = null;
  }
  function handleWheel(e) {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.08 : 0.92;
    setView((v) => ({ ...v, scale: clamp(v.scale * factor, 0.3, 3) }));
  }
  function zoomBy(f) {
    setView((v) => ({ ...v, scale: clamp(v.scale * f, 0.3, 3) }));
  }
  function recenter() {
    const rect = svgRef.current.getBoundingClientRect();
    setView({ scale: 1, tx: rect.width / 2, ty: rect.height / 2 });
  }

  function starClicked(star) {
    if (mode === "open") onOpenStar(star.id);
    else if (mode === "link") {
      if (linkFirst === null) setLinkFirst(star.id);
      else if (linkFirst === star.id) setLinkFirst(null);
      else {
        onLink(linkFirst, star.id);
        setLinkFirst(null);
      }
    } else if (mode === "group") {
      setGroupSelection((sel) => (sel.includes(star.id) ? sel.filter((id) => id !== star.id) : [...sel, star.id]));
    }
  }
  function starPointerDown(e, star) {
    if (mode !== "move") return;
    e.stopPropagation();
    starDrag.current = { id: star.id, pointerId: e.pointerId };
  }

  const hint = {
    open: "Tap a star to open it. Drag the background to look around.",
    move: "Drag a star to move it.",
    link: linkFirst ? "Tap another star to connect it." : "Tap a star, then tap a second star to connect them.",
    group: "Tap stars to select them, then constellate.",
  }[mode];

  return (
    <div className="sky-screen">
      <div className="sky-topbar">
        <div className="sky-topbar-row">
          <button className="text-link" onClick={onSettings}>Data actions</button>
          <div className="sky-modes">
            {[
              ["open", "open"],
              ["move", "move"],
              ["link", "link"],
              ["group", "group"],
            ].map(([key, label]) => (
              <button key={key} className={`sky-mode-btn${mode === key ? " active" : ""}`} onClick={() => setMode(key)}>
                {label}
              </button>
            ))}
          </div>
          <button className="text-link" onClick={onCalendar}>Log</button>
        </div>
        <div className="sky-hint">{hint}</div>
      </div>

      <svg
        ref={svgRef}
        className="sky-canvas"
        onPointerDown={bgPointerDown}
        onPointerMove={bgPointerMove}
        onPointerUp={bgPointerUp}
        onPointerCancel={bgPointerUp}
        onWheel={handleWheel}
      >
        <defs>
          <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--line)" />
          </marker>
        </defs>

        <g transform={`translate(${view.tx},${view.ty}) scale(${view.scale})`}>
          {data.constellations.map((c) => {
            const pts = c.members.map((id) => data.stars.find((s) => s.id === id)).filter(Boolean).map((s) => ({ x: s.x, y: s.y }));
            const b = constellationBoundary(pts);
            if (!b) return null;
            return (
              <g key={c.id} style={{ pointerEvents: mode === "open" ? "all" : "none" }} onClick={() => onOpenConstellation(c.id)}>
                {b.path ? (
                  <path d={b.path} fill="var(--gold-soft)" stroke="rgba(94,200,255,0.5)" strokeWidth={1.2} />
                ) : (
                  <circle cx={b.circle.cx} cy={b.circle.cy} r={b.circle.r} fill="var(--gold-soft)" stroke="rgba(94,200,255,0.5)" strokeWidth={1.2} />
                )}
                <text x={b.cx} y={b.path ? b.cy : b.circle.cy - b.circle.r - 12} textAnchor="middle" fontFamily="var(--font-display)" fontSize={15} fill="var(--gold)" className="user-text" style={{ pointerEvents: "none" }}>
                  {c.name}
                </text>
              </g>
            );
          })}

          {data.connections.map((c) => {
            const a = data.stars.find((s) => s.id === c.source);
            const b = data.stars.find((s) => s.id === c.target);
            if (!a || !b) return null;
            return (
              <line
                key={c.id}
                x1={a.x} y1={a.y} x2={b.x} y2={b.y}
                stroke="var(--line)" strokeWidth={1.3} markerEnd="url(#arrow)"
                style={{ cursor: mode === "link" ? "pointer" : "default", pointerEvents: mode === "link" ? "stroke" : "none" }}
                onClick={(e) => { if (mode === "link") { e.stopPropagation(); onRemoveConnection(c.id); } }}
              />
            );
          })}

          {data.stars.map((s) => {
            const selected = (mode === "link" && linkFirst === s.id) || (mode === "group" && groupSelection.includes(s.id));
            return (
              <g
                key={s.id}
                transform={`translate(${s.x},${s.y})`}
                onPointerDown={(e) => starPointerDown(e, s)}
                onClick={(e) => { e.stopPropagation(); starClicked(s); }}
                style={{ cursor: mode === "move" ? "grab" : "pointer" }}
              >
                {selected && <circle r={17} fill="none" stroke="var(--gold)" strokeWidth={1.5} />}
                <circle r={7} fill="var(--star)" filter="url(#glow)" opacity={0.95} />
                <text y={26} textAnchor="middle" fontSize={12} fill="var(--star-dim)" fontFamily="var(--font-body)" className="user-text">
                  {s.name.length > 20 ? s.name.slice(0, 19) + "…" : s.name}
                </text>
              </g>
            );
          })}
        </g>
      </svg>

      {data.stars.length === 0 && (
        <div className="sky-empty">
          <div className="pulse-star">✦</div>
          <h2 className="display" style={{ fontSize: 20 }}>Your sky is empty</h2>
          <p className="muted">Wander a while, or add an idea straight away.</p>
        </div>
      )}

      {mode === "open" && (
        <MoonAnchor
          pos={moonPos}
          defaultPos={{ x: 0.5, y: 0.78 }}
          onMove={onMoveMoon}
          onWander={onWander}
          onAddIdea={onAddIdea}
          showHint={!moonPos}
        />
      )}

      <div className="sky-zoom">
        <button className="zoom-btn" onClick={() => zoomBy(1.2)}>+</button>
        <button className="zoom-btn" onClick={() => zoomBy(0.83)}>–</button>
        <button className="zoom-btn" style={{ fontSize: 13 }} onClick={recenter}>⟲</button>
      </div>

      {mode === "group" && groupSelection.length >= 2 && (
        <div className="constellate-fab">
          <button className="bracket-btn primary" onClick={onConstellate}>
            🌌 Constellate ({groupSelection.length})
          </button>
        </div>
      )}
    </div>
  );
}

/* ============================== Calendar / wander log ============================== */

function CalendarScreen({ stars, connections, constellations, onBack, onOpenStar, onOpenConstellation }) {
  const [viewDate, setViewDate] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d;
  });
  const [selectedDay, setSelectedDay] = useState(null);

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthLabel = viewDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  function keyFor(timestamp) {
    const d = new Date(timestamp);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }

  const starsByDay = useMemo(() => {
    const map = {};
    for (const s of stars) (map[keyFor(s.date)] = map[keyFor(s.date)] || []).push(s);
    return map;
  }, [stars]);

  const constellationsByDay = useMemo(() => {
    const map = {};
    for (const c of constellations) {
      if (!c.date) continue;
      (map[keyFor(c.date)] = map[keyFor(c.date)] || []).push(c);
    }
    return map;
  }, [constellations]);

  const connectionCountByDay = useMemo(() => {
    const map = {};
    for (const c of connections) {
      if (!c.date) continue;
      const k = keyFor(c.date);
      map[k] = (map[k] || 0) + 1;
    }
    return map;
  }, [connections]);

  function dayKey(d) {
    return `${year}-${month}-${d}`;
  }
  function hasConnectEvent(d) {
    const k = dayKey(d);
    return !!constellationsByDay[k] || !!connectionCountByDay[k];
  }
  const today = new Date();
  function isToday(d) {
    return d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
  }

  let monthStarCount = 0, monthConstellationCount = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    monthStarCount += (starsByDay[dayKey(d)] || []).length;
    monthConstellationCount += (constellationsByDay[dayKey(d)] || []).length;
  }

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const selectedStars = selectedDay ? starsByDay[dayKey(selectedDay)] || [] : [];
  const selectedConstellations = selectedDay ? constellationsByDay[dayKey(selectedDay)] || [] : [];
  const selectedConnectionCount = selectedDay ? connectionCountByDay[dayKey(selectedDay)] || 0 : 0;

  const summary = monthStarCount === 0
    ? "No stars yet this month."
    : `${monthStarCount} star${monthStarCount === 1 ? "" : "s"}` +
      (monthConstellationCount > 0 ? ` · ${monthConstellationCount} constellation${monthConstellationCount === 1 ? "" : "s"} formed` : "") +
      " this month.";

  return (
    <div className="column" style={{ justifyContent: "flex-start" }}>
      <button className="text-link" style={{ alignSelf: "flex-start" }} onClick={onBack}>← Sky</button>
      <h2 className="display">Your wander log</h2>
      <p className="muted">{summary}</p>

      <div className="cal-nav">
        <button className="text-link" onClick={() => { setViewDate(new Date(year, month - 1, 1)); setSelectedDay(null); }}>‹ Prev</button>
        <span className="cal-month-label">{monthLabel}</span>
        <button className="text-link" onClick={() => { setViewDate(new Date(year, month + 1, 1)); setSelectedDay(null); }}>Next ›</button>
      </div>

      <div className="cal-grid">
        {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => (
          <div key={i} className="cal-dow-cell">{d}</div>
        ))}
        {cells.map((d, i) => {
          if (d === null) return <div key={`empty-${i}`} className="cal-cell cal-cell-empty" />;
          const dayStars = starsByDay[dayKey(d)] || [];
          const connected = hasConnectEvent(d);
          const clickable = dayStars.length > 0 || connected;
          const selected = selectedDay === d;
          return (
            <button
              key={d}
              className={`cal-cell${dayStars.length ? " has-stars" : ""}${isToday(d) ? " today" : ""}${selected ? " selected" : ""}`}
              onClick={() => clickable && setSelectedDay(selected ? null : d)}
            >
              <span className="cal-day-num">{d}</span>
              {(dayStars.length > 0 || connected) && (
                <span className="cal-star-row-mini">
                  {Array.from({ length: Math.min(dayStars.length, 4) }).map((_, k) => (
                    <span key={k} className="cal-star">✦</span>
                  ))}
                  {connected && <span className="cal-star cal-star-gold">✦</span>}
                </span>
              )}
            </button>
          );
        })}
      </div>

      {selectedDay && (
        <div className="cal-day-panel">
          <p className="modal-meta">
            {new Date(year, month, selectedDay).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}
          </p>
          {selectedStars.map((s) => (
            <button key={s.id} className="cal-star-row" onClick={() => onOpenStar(s.id)}>
              <span className="user-text">✦ {s.name}</span>
              <span className="modal-meta">{s.activity}</span>
            </button>
          ))}
          {selectedConstellations.length > 0 && (
            <>
              <p className="modal-meta" style={{ marginTop: 6 }}>Connected into a constellation</p>
              {selectedConstellations.map((c) => (
                <button key={c.id} className="cal-star-row" onClick={() => onOpenConstellation(c.id)}>
                  <span className="cal-star-gold-text user-text">🌌 {c.name}</span>
                </button>
              ))}
            </>
          )}
          {selectedConnectionCount > 0 && (
            <p className="modal-meta" style={{ marginTop: 6 }}>
              {selectedConnectionCount} connection{selectedConnectionCount === 1 ? "" : "s"} drawn between stars
            </p>
          )}
        </div>
      )}
    </div>
  );
}

/* ============================== Modals ============================== */

function ModalBase({ children, onClose }) {
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

function StarModal({ star, onClose, onRename, onEdit, onSetMedia, onAddPhotos, onRemovePhoto, onDelete, onLinkFromHere }) {
  const [audio, setAudio] = useState(null);
  const [photos, setPhotos] = useState([]);
  const audioId = star ? star.audioId : null;
  const photoKey = starPhotoIds(star).join(",");
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const a = audioId ? await mediaGet(audioId) : null;
      const list = [];
      for (const id of photoKey ? photoKey.split(",") : []) {
        const src = await mediaGet(id);
        if (src) list.push({ id, src });
      }
      if (!cancelled) { setAudio(a); setPhotos(list); }
    })();
    return () => { cancelled = true; };
  }, [audioId, photoKey]);
  const [editingName, setEditingName] = useState(false);
  const [editingContent, setEditingContent] = useState(false);
  const [name, setName] = useState(star ? star.name : "");
  const [content, setContent] = useState(star ? star.content : "");
  const [confirmDelete, setConfirmDelete] = useState(false);
  if (!star) return null;

  function saveName() {
    onRename(name.trim() || star.name);
    setEditingName(false);
  }
  function cancelName() {
    setName(star.name);
    setEditingName(false);
  }
  function saveContent() {
    onEdit(content);
    setEditingContent(false);
  }
  function cancelContent() {
    setContent(star.content);
    setEditingContent(false);
  }

  return (
    <ModalBase onClose={onClose}>
      {editingName ? (
        <div className="edit-field-group">
          <input
            className="field" value={name} autoFocus onChange={(e) => setName(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") saveName(); if (e.key === "Escape") cancelName(); }}
          />
          <div className="modal-row" style={{ justifyContent: "flex-start" }}>
            <button className="text-link" onClick={saveName}>Save</button>
            <button className="text-link" onClick={cancelName}>Cancel</button>
          </div>
        </div>
      ) : (
        <button className="editable-field" onClick={() => setEditingName(true)}>
          <h2 className="display user-text" style={{ fontSize: 22, margin: 0 }}>✦ {star.name}</h2>
          <span className="edit-icon">✎</span>
        </button>
      )}

      {editingContent ? (
        <div className="edit-field-group">
          <textarea
            className="field" rows={4} autoFocus value={content} onChange={(e) => setContent(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Escape") cancelContent(); }}
          />
          <div className="modal-row" style={{ justifyContent: "flex-start" }}>
            <button className="text-link" onClick={saveContent}>Save</button>
            <button className="text-link" onClick={cancelContent}>Cancel</button>
          </div>
        </div>
      ) : (
        <button className="editable-field" onClick={() => setEditingContent(true)}>
          <p className={`body${star.content ? " user-text" : ""}`} style={{ margin: 0 }}>{star.content || "add a thought…"}</p>
          <span className="edit-icon">✎</span>
        </button>
      )}

      <MediaEditor
        audio={audio}
        photos={photos}
        onAudio={(v) => { setAudio(v); onSetMedia("audio", v); }}
        onAddPhotos={(srcs) => onAddPhotos(srcs)}
        onRemovePhoto={(id) => { setPhotos((ps) => ps.filter((p) => p.id !== id)); onRemovePhoto(id); }}
      />

      <p className="modal-meta">{star.activity} · {fmtDate(star.date)}</p>

      <div className="modal-row">
        {!confirmDelete ? (
          <>
            <button className="bracket-btn" onClick={onLinkFromHere}>Connect from here</button>
            <button className="bracket-btn danger" onClick={() => setConfirmDelete(true)}>Delete</button>
            <button className="bracket-btn primary" onClick={onClose}>Close</button>
          </>
        ) : (
          <>
            <p className="muted" style={{ width: "100%" }}>Remove this star for good?</p>
            <button className="bracket-btn" onClick={() => setConfirmDelete(false)}>Cancel</button>
            <button className="bracket-btn danger" onClick={onDelete}>Yes, delete</button>
          </>
        )}
      </div>
    </ModalBase>
  );
}

function ConstellationModal({ constellation, stars, onClose, onRename, onRemoveStar, onOpenStar, onDelete }) {
  const [editingName, setEditingName] = useState(false);
  const [name, setName] = useState(constellation ? constellation.name : "");
  const [confirmDelete, setConfirmDelete] = useState(false);
  if (!constellation) return null;
  const members = constellation.members.map((id) => stars.find((s) => s.id === id)).filter(Boolean);

  return (
    <ModalBase onClose={onClose}>
      {editingName ? (
        <input className="field" value={name} autoFocus onChange={(e) => setName(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && (onRename(name), setEditingName(false))}
          onBlur={() => { onRename(name); setEditingName(false); }} />
      ) : (
        <button className="editable-field" onClick={() => setEditingName(true)}>
          <h2 className="display user-text" style={{ fontSize: 22, margin: 0 }}>🌌 {constellation.name}</h2>
          <span className="edit-icon">✎</span>
        </button>
      )}
      <div>
        {members.map((s) => (
          <div className="member-row" key={s.id}>
            <button className="name-btn user-text" onClick={() => onOpenStar(s.id)}>✦ {s.name}</button>
            <button className="x-btn" onClick={() => onRemoveStar(s.id)}>remove</button>
          </div>
        ))}
      </div>
      <div className="modal-row">
        {!confirmDelete ? (
          <>
            <button className="bracket-btn danger" onClick={() => setConfirmDelete(true)}>Delete constellation</button>
            <button className="bracket-btn primary" onClick={onClose}>Close</button>
          </>
        ) : (
          <>
            <p className="muted" style={{ width: "100%" }}>This won't delete the stars, only the grouping.</p>
            <button className="bracket-btn" onClick={() => setConfirmDelete(false)}>Cancel</button>
            <button className="bracket-btn danger" onClick={onDelete}>Yes, delete</button>
          </>
        )}
      </div>
    </ModalBase>
  );
}

function AddActivityModal({ onClose, onAdd }) {
  const [name, setName] = useState("");
  const [instruction, setInstruction] = useState("");
  return (
    <ModalBase onClose={onClose}>
      <h2 className="display" style={{ fontSize: 22 }}>Add your own way to wander</h2>
      <input className="field" placeholder="e.g. Watch clouds" value={name} onChange={(e) => setName(e.target.value)} autoFocus />
      <textarea className="field" rows={2} placeholder="A short line describing it (optional)" value={instruction} onChange={(e) => setInstruction(e.target.value)} />
      <div className="modal-row">
        <button className="bracket-btn" onClick={onClose}>Cancel</button>
        <button className="bracket-btn primary" disabled={!name.trim()} onClick={() => onAdd(name, instruction)}>Add & begin</button>
      </div>
    </ModalBase>
  );
}

function NamePromptModal({ title, placeholder, confirmLabel, onClose, onConfirm }) {
  const [name, setName] = useState("");
  return (
    <ModalBase onClose={onClose}>
      <h2 className="display" style={{ fontSize: 21 }}>{title}</h2>
      <input className="field" placeholder={placeholder} value={name} autoFocus onChange={(e) => setName(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && name.trim() && onConfirm(name)} />
      <div className="modal-row">
        <button className="bracket-btn" onClick={onClose}>Cancel</button>
        <button className="bracket-btn primary" disabled={!name.trim()} onClick={() => onConfirm(name)}>{confirmLabel}</button>
      </div>
    </ModalBase>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ConstellateApp />);
</script>
</body>
